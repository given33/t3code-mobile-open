name: T3Mobile
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  T3MobileCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  T3Mobile:
    type: application
    platform: iOS
    sources:
      - path: T3Mobile
        excludes: [Info.plist]
    dependencies:
      - package: T3MobileCore
        product: T3MobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.t3mobile.client
        INFOPLIST_FILE: T3Mobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.3.0'
        CURRENT_PROJECT_VERSION: 1
schemes:
  T3Mobile:
    build:
      targets:
        T3Mobile: all
