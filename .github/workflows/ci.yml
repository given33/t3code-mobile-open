name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-privacy.mjs
      - run: npm --prefix plugin ci --ignore-scripts
      - run: npm --prefix plugin test
      - run: npm --prefix plugin run pack:plugin
